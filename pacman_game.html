<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Maze — ceļš no A līdz B</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #080d19;
      color: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 0, #182544 0, transparent 55%),
        #080d19;
    }

    .app {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      margin: 0;
      font-size: 13px;
      letter-spacing: .16em;
      color: #a9bad8;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(22px, 4vw, 30px);
    }

    .level {
      padding: 8px 12px;
      border: 1px solid #293754;
      border-radius: 999px;
      color: #c4d2ec;
      font-size: 13px;
      white-space: nowrap;
    }

    .game {
      padding: 16px;
      border: 1px solid #283653;
      border-radius: 18px;
      background: linear-gradient(145deg, #121c30, #0d1424);
      box-shadow: 0 22px 65px #0007;
    }

    .gamebar,
    .stats,
    .actions,
    .route-list {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gamebar {
      margin: 0 2px 12px;
      color: #aebdd6;
      font-size: 14px;
    }

    .gamebar strong {
      color: #f5f8ff;
      font-size: 15px;
    }

    .canvas-wrap {
      overflow: hidden;
      border: 1px solid #2b3c5d;
      border-radius: 12px;
      background: #111a2b;
      line-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      touch-action: none;
    }

    .stats {
      justify-content: flex-start;
      flex-wrap: wrap;
      margin: 13px 2px;
      color: #b7c5df;
      font-size: 13px;
    }

    .stat {
      padding: 7px 10px;
      border: 1px solid #293754;
      border-radius: 9px;
      background: #111a2b;
    }

    .stat span {
      color: #fff;
      font-weight: 700;
    }

    .actions {
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    button {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid #354565;
      border-radius: 9px;
      background: #1a2740;
      color: #f2f6ff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, transform .15s, border-color .15s;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #6981ad;
      background: #243552;
    }

    button:focus-visible {
      outline: 2px solid #69d6ff;
      outline-offset: 2px;
    }

    button.primary {
      border-color: #e5b92e;
      background: #f4c430;
      color: #1b1a13;
      font-weight: 700;
    }

    button.primary:hover {
      background: #ffda55;
    }

    .route-area {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #293754;
    }

    .route-title {
      margin: 0 0 9px;
      color: #aebdd6;
      font-size: 13px;
    }

    .route-list {
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .route-chip {
      min-height: 32px;
      padding: 5px 9px;
      border-color: var(--route-color);
      color: #e8efff;
      font-size: 12px;
    }

    .route-chip.active {
      background: color-mix(in srgb, var(--route-color) 35%, #152038);
      box-shadow: inset 0 0 0 1px var(--route-color);
    }

    .help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
      color: #91a2c0;
      font-size: 12px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 30px);
      gap: 3px;
    }

    .dpad button {
      min-height: 30px;
      padding: 0;
      font-size: 14px;
    }

    .dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .dpad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 520px) {
      body { padding: 18px 10px; }
      .game { padding: 10px; }
      header { align-items: flex-start; }
      .level { padding: 7px 9px; font-size: 11px; }
      .help { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="brand">Pac-Maze</p>
        <h1>Atrodi ceļu līdz B</h1>
      </div>
      <div class="level">1. līmenis · Labirints</div>
    </header>

    <section class="game" aria-label="Pac-Maze spēle">
      <div class="gamebar">
        <strong id="message">Dodieties no A līdz B!</strong>
        <span id="route-count">Meklē ceļus…</span>
      </div>

      <div class="canvas-wrap">
        <canvas id="maze" width="650" height="390" aria-label="Labirints no A līdz B"></canvas>
      </div>

      <div class="stats">
        <div class="stat">Punkti: <span id="score">0</span></div>
        <div class="stat">Soļi: <span id="steps">0</span></div>
        <div class="stat">Atlikušās piciņas: <span id="pellets">0</span></div>
      </div>

      <div class="actions">
        <button class="primary" id="reset">↻ Sākt no jauna</button>
        <button id="hint">Rādīt nākamo ceļu</button>
        <button id="auto">▶ Izspēlēt ceļu</button>
        <button id="pause">■ Apturēt</button>
      </div>

      <div class="route-area">
        <p class="route-title">Visi atrastie ceļi — izvēlies, lai parādītu padomu:</p>
        <div class="route-list" id="routes"></div>
      </div>

      <div class="help">
        <span>Kusties ar bultiņām vai WASD. Savāc piciņas un sasniedz B.</span>
        <div class="dpad" aria-label="Kustību pogas">
          <button data-dir="up" aria-label="Uz augšu">↑</button>
          <button data-dir="left" aria-label="Pa kreisi">←</button>
          <button data-dir="down" aria-label="Uz leju">↓</button>
          <button data-dir="right" aria-label="Pa labi">→</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const maze = [
      "#########################",
      "#A  #       #           #",
      "# # # ##### # ######### #",
      "# #   #   #   #       # #",
      "# ##### # ##### ##### # #",
      "#     # #     #     #   #",
      "##### # ##### ##### ### #",
      "#   # #     #     #   # #",
      "# # # ##### ##### # # # #",
      "# #       #     #   #   #",
      "# ####### ##### ####### #",
      "#       #     #       # #",
      "# ##### ##### # ##### # #",
      "#     #       #     #  B#",
      "#########################"
    ];
    const cellSize = 26;
    const colors = ["#ff5364", "#43b5ff", "#44d39a", "#c27bff"];
    const moves = {
      up: [-1, 0],
      right: [0, 1],
      down: [1, 0],
      left: [0, -1]
    };
    const canvas = document.getElementById("maze");
    const ctx = canvas.getContext("2d");
    const start = findCell("A");
    const goal = findCell("B");
    const paths = findAllPaths();
    let player = { ...start };
    let direction = "right";
    let score = 0;
    let steps = 0;
    let hintIndex = -1;
    let hintVisible = false;
    let won = false;
    let timer = null;
    let autoStep = 0;
    let autoStarted = false;
    let dots = new Set();

    function findCell(marker) {
      for (let row = 0; row < maze.length; row++) {
        const col = maze[row].indexOf(marker);
        if (col !== -1) return { row, col };
      }
      throw new Error(`Labirintā nav atrasta šūna ${marker}`);
    }

    function findAllPaths() {
      const found = [];
      const visited = new Set([key(start)]);
      const path = [{ ...start }];

      function search(cell) {
        if (cell.row === goal.row && cell.col === goal.col) {
          found.push(path.map(point => ({ ...point })));
          return;
        }
        for (const [name, [dr, dc]] of Object.entries(moves)) {
          const next = { row: cell.row + dr, col: cell.col + dc };
          const id = key(next);
          if (
            maze[next.row]?.[next.col] &&
            maze[next.row][next.col] !== "#" &&
            !visited.has(id)
          ) {
            visited.add(id);
            path.push(next);
            search(next);
            path.pop();
            visited.delete(id);
          }
        }
      }

      search(start);
      return found;
    }

    function key(point) {
      return `${point.row},${point.col}`;
    }

    function resetDots() {
      dots = new Set();
      maze.forEach((line, row) => {
        [...line].forEach((cell, col) => {
          if (cell === " " && !(row === start.row && col === start.col)) {
            dots.add(key({ row, col }));
          }
        });
      });
      dots.delete(key(goal));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      maze.forEach((line, row) => {
        [...line].forEach((tile, col) => {
          const x = col * cellSize;
          const y = row * cellSize;
          if (tile === "#") {
            ctx.fillStyle = "#26395d";
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeStyle = "#344a72";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
          } else {
            ctx.fillStyle = "#111a2d";
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeStyle = "#1b2942";
            ctx.strokeRect(x, y, cellSize, cellSize);
            if (dots.has(key({ row, col }))) {
              ctx.beginPath();
              ctx.fillStyle = "#dbeafe";
              ctx.arc(x + cellSize / 2, y + cellSize / 2, 2.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });
      });

      if (hintVisible && paths[hintIndex]) {
        const route = paths[hintIndex];
        ctx.beginPath();
        route.forEach((point, index) => {
          const x = point.col * cellSize + cellSize / 2;
          const y = point.row * cellSize + cellSize / 2;
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = colors[hintIndex] + "a8";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }

      drawMarker(start, "A", "#53df9a");
      drawMarker(goal, "B", "#ff7180");
      drawPlayer();
    }

    function drawMarker(point, label, color) {
      const x = point.col * cellSize + cellSize / 2;
      const y = point.row * cellSize + cellSize / 2;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.font = "bold 11px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y + 0.5);
    }

    function drawPlayer() {
      const x = player.col * cellSize + cellSize / 2;
      const y = player.row * cellSize + cellSize / 2;
      const angles = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };
      const angle = angles[direction];
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, 10, angle + 0.38, angle + Math.PI * 2 - 0.38);
      ctx.closePath();
      ctx.fillStyle = "#ffd43b";
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = "#172033";
      ctx.arc(x + Math.cos(angle - 0.65) * 4, y + Math.sin(angle - 0.65) * 4, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function move(name) {
      if (won || timer) return;
      autoStarted = false;
      const [dr, dc] = moves[name];
      const next = { row: player.row + dr, col: player.col + dc };
      if (!maze[next.row]?.[next.col] || maze[next.row][next.col] === "#") return;
      direction = name;
      player = next;
      steps++;
      const id = key(player);
      if (dots.delete(id)) score += 10;
      updateStats();
      if (player.row === goal.row && player.col === goal.col) finishGame();
      draw();
    }

    function updateStats() {
      document.getElementById("score").textContent = score;
      document.getElementById("steps").textContent = steps;
      document.getElementById("pellets").textContent = dots.size;
    }

    function finishGame() {
      won = true;
      stopAuto();
      document.getElementById("message").textContent = "🎉 Mērķis sasniegts!";
    }

    function resetGame() {
      stopAuto();
      player = { ...start };
      direction = "right";
      score = 0;
      steps = 0;
      autoStep = 0;
      autoStarted = false;
      won = false;
      resetDots();
      document.getElementById("message").textContent = "Dodieties no A līdz B!";
      updateStats();
      draw();
    }

    function chooseHint(index) {
      stopAuto();
      autoStarted = false;
      hintIndex = index;
      hintVisible = true;
      document.getElementById("message").textContent =
        `Padoms: ceļš ${index + 1} — ${paths[index].length - 1} soļi`;
      document.querySelectorAll(".route-chip").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });
      draw();
    }

    function stopAuto() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      document.getElementById("auto").textContent = "▶ Izspēlēt ceļu";
    }

    function playHint() {
      if (timer) return;
      if (hintIndex < 0) chooseHint(0);
      if (!autoStarted) {
        resetGame();
        autoStarted = true;
      }
      const route = paths[hintIndex];
      document.getElementById("auto").textContent = "▶ Atsākt";
      timer = setInterval(() => {
        if (autoStep >= route.length - 1) {
          stopAuto();
          return;
        }
        const next = route[++autoStep];
        const dr = next.row - player.row;
        const dc = next.col - player.col;
        direction = Object.keys(moves).find(name =>
          moves[name][0] === dr && moves[name][1] === dc
        );
        player = { ...next };
        steps++;
        if (dots.delete(key(player))) score += 10;
        updateStats();
        if (player.row === goal.row && player.col === goal.col) finishGame();
        draw();
      }, 110);
    }

    document.addEventListener("keydown", event => {
      const controls = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowRight: "right", d: "right", D: "right",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left"
      };
      const directionName = controls[event.key];
      if (directionName) {
        event.preventDefault();
        move(directionName);
      }
    });

    document.querySelectorAll(".dpad button").forEach(button => {
      button.addEventListener("click", () => move(button.dataset.dir));
    });
    document.getElementById("reset").addEventListener("click", resetGame);
    document.getElementById("hint").addEventListener("click", () => {
      const next = (hintIndex + 1) % paths.length;
      chooseHint(next);
    });
    document.getElementById("auto").addEventListener("click", playHint);
    document.getElementById("pause").addEventListener("click", stopAuto);

    document.getElementById("route-count").textContent =
      `${paths.length} iespējamie ceļi`;
    paths.forEach((path, index) => {
      const button = document.createElement("button");
      button.className = "route-chip";
      button.style.setProperty("--route-color", colors[index]);
      button.textContent = `Ceļš ${index + 1} · ${path.length - 1} soļi`;
      button.addEventListener("click", () => chooseHint(index));
      document.getElementById("routes").append(button);
    });

    resetDots();
    updateStats();
    draw();
  </script>
</body>
</html>
